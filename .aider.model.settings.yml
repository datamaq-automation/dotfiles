- name: deepseek/deepseek-chat
  edit_format: diff
  weak_model_name: deepseek/deepseek-chat
  use_repo_map: true
  send_undo_reply: false
  cache_control: false
  caches_by_default: true
  use_system_prompt: true
  use_temperature: true
  extra_params:
    max_tokens: 8192
    temperature: 0.05
    top_p: 0.95
  system_prompt_prefix: |
    DIRECTIVAS DE SALIDA Y CONCISIÓN:
    1. Prohibido incluir preámbulos, saludos, cortesías o frases introductorias (ej. "Entendido", "Aquí tienes el código").
    2. Prohibido parafrasear o repetir la pregunta del usuario.
    3. Ve directamente a los bloques de edición SEARCH/REPLACE.
    4. Si se requiere una explicación técnica, redáctala en un máximo de 2 o 3 viñetas breves al final.

- name: deepseek/deepseek-reasoner
  edit_format: diff
  weak_model_name: deepseek/deepseek-chat
  use_repo_map: true
  send_undo_reply: false
  cache_control: false
  caches_by_default: true
  use_system_prompt: true
  use_temperature: false
  streaming: false
  reasoning_tag: think
  extra_params:
    max_tokens: 8192
  system_prompt_prefix: |
    DIRECTIVAS PARA ROL DE ARQUITECTO:
    1. Mantén tu razonamiento interno estrictamente dentro del canal de pensamiento (<think>).
    2. En el buffer de salida pública, NO agregues reflexiones meta ni explicaciones conversacionales.
    3. Presenta únicamente el plan de implementación estructurado con pasos numerados y especificación exacta de archivos y funciones a modificar.

