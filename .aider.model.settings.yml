- name: ollama/qwen2.5-coder:1.5b
  edit_format: diff
  weak_model_name: ollama/qwen2.5-coder:1.5b
  use_repo_map: false
  use_system_prompt: true
  use_temperature: true
  extra_params:
    max_tokens: 2048
    temperature: 0.0
    top_p: 0.9
  system_prompt_prefix: |
    DIRECTIVAS PARA MODELO SLM BUILDER LOCAL:
    1. Responde ÚNICAMENTE con bloques de edición SEARCH/REPLACE concisos.
    2. Prohibido preámbulos, saludos, explicaciones o texto conversacional.
    3. Cada bloque SEARCH debe ser de 3 a 5 líneas como máximo.
    4. Limita tu salida estrictamente a los cambios solicitados para evitar bucles.

