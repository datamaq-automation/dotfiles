# Configuración tmux - Moderno y funcional

# Prefijo: Ctrl+A (más accesible que Ctrl+B)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Numeración desde 1 (más intuitivo)
set -g base-index 1
setw -g pane-base-index 1

# Vi keybindings
setw -g mode-keys vi
set -g status-keys vi

# Dividir panes con keys intuitivas
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegar panes con Alt+Flechas (sin prefijo)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Navegar windows con Alt+H/L
bind -n M-h previous-window
bind -n M-l next-window

# Redimensionar panes con Ctrl+Flechas
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5

# Reload configuración
bind r source-file ~/.tmux.conf \; display "Configuración recargada"

# Terminal 256 colores
set -g default-terminal "screen-256color"

# Scrollback history
set -g history-limit 10000

# Mouse support
set -g mouse on

# Status bar - Minimalista
set -g status-bg "#1e1e1e"
set -g status-fg "#e0e0e0"
set -g status-left "#[fg=#61afef]#S #[fg=#56b6c2]│ "
set -g status-right "#[fg=#56b6c2]%H:%M %d/%m │ #[fg=#56b6c2]#(/home/agustin/.tmux/battery.sh)#[fg=#56b6c2] #(/home/agustin/.tmux/wifi.sh)#[fg=#56b6c2] #(/home/agustin/.tmux/internet.sh)"
set -g status-interval 30

# Pane borders
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# Window status
setw -g window-status-format "#[fg=#56b6c2]#I#[fg=#3e4452] │ #[fg=#e0e0e0]#W"
setw -g window-status-current-format "#[fg=#61afef,bold]#I#[fg=#56b6c2,bold] │ #[fg=#e0e0e0,bold]#W"

# No rename automático de windows
set -g allow-rename off

# Copiar a clipboard del sistema (xclip requerido)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"


