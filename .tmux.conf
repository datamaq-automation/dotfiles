# Configuración tmux - 3 paneles: Orquestador | Backend
#                                              | Frontend

# Crear layout de desarrollo con Ctrl+B D
bind D new-window -n dev \; \
  send-keys "cd ~ && clear" C-m \; \
  split-window -h -p 50 \; \
  send-keys "cd ~ && clear" C-m \; \
  split-window -v -p 50 \; \
  send-keys "cd ~ && clear" C-m \; \
  select-pane -L

# Navegación rápida entre paneles
bind -n C-h select-pane -L    # Ctrl+H = izquierda (Orquestador)
bind -n C-l select-pane -R    # Ctrl+L = derecha (Backend/Frontend)
bind -n C-j select-pane -D    # Ctrl+J = abajo (Frontend)
bind -n C-k select-pane -U    # Ctrl+K = arriba (Backend)

# Redimensionar paneles
bind -n C-M-h resize-pane -L 5
bind -n C-M-l resize-pane -R 5
bind -n C-M-j resize-pane -D 5
bind -n C-M-k resize-pane -U 5

# Otras mejoras
set -g mouse on                # Soporte mouse
set -g base-index 1            # Ventanas empiezan en 1 (no 0)
set -g pane-base-index 1       # Paneles empiezan en 1 (no 0)
set -g default-terminal "screen-256color"

# Status bar minimalista
set -g status-bg black
set -g status-fg white
set -g status-left " #S "
set -g status-right " %H:%M "
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Comando: copiar buffer al portapapeles
bind-key -n M-c run-shell "tmux save-buffer - | xclip -selection clipboard" \; display-message "Buffer copiado al portapapeles (Alt+C)"

# Hook: copiar al portapapeles del sistema (para programas locales que usan OSC 52)
set-hook -g pane-set-clipboard 'run-shell "tmux save-buffer - | xclip -selection clipboard"'
